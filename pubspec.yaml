name: bataan_lgu_scanner
description: "LGU Scanner App for Bataan Province"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.8+8

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  image_picker: ^1.2.3
  http: ^1.2.2
  signature: ^6.3.0
  shared_preferences: ^2.3.2
  package_info_plus: ^10.2.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/app_launcher.png"
  min_sdk_android: 21
  windows:
    generate: true
  macos:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/logo/

